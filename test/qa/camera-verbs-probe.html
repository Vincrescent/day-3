<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<base href="../..">
<title>Camera Verbs — live probe</title>
</head>
<body>
<pre id="out">RUNNING…</pre>
<script src="js/camera-verbs.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var pass = 0, fail = 0;
  function log(ok, name, extra) {
    pass += ok ? 1 : 0; fail += ok ? 0 : 1;
    out.textContent += '\n' + (ok ? 'PASS ' : 'FAIL ') + name + (extra ? ' :: ' + extra : '');
    console.log((ok ? 'PASS ' : 'FAIL ') + name + (extra ? ' :: ' + extra : ''));
  }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  var CV = window.UECameraVerbs;
  var cam = { tTheta: 0, tPhi: 1.05, tRadius: 250, theta: 0, phi: 1.05, radius: 250 };

  (async function () {
    // 1. real wall-clock: continuous orbit menggerakkan camera selama 0.5s
    var slot = CV.createMotionSlot();
    slot.start('orbit', { direction: 'right', speed: 'fast', mode: 'continuous' });
    var t0 = performance.now();
    while (performance.now() - t0 < 500) {
      slot.tick(cam, 1 / 60);
      await sleep(16);
    }
    log(Math.abs(cam.tTheta) > 0.10 && Math.abs(cam.tTheta) < 0.16, 'continuous orbit bergerak (fast 14°/s × 0.5s ≈ 0.122 rad)', 'dθ=' + cam.tTheta.toFixed(4) + ' rad = ' + (cam.tTheta * 180 / Math.PI).toFixed(2) + '°');

    // 2. interrupt berhenti INSTAN (efek cancelFlight)
    var before = cam.tTheta;
    var r = slot.interrupt('manual-input');
    log(r.wasActive && r.reason === 'manual-input' && !slot.active, 'interrupt → wasActive+reason, slot idle');
    cam.tTheta = 0;
    slot.tick(cam, 0.1);
    log(cam.tTheta === 0, 'setelah interrupt, tick tak mengubah camera');

    // 3. speed words: fast ~4.67× slow
    slot = CV.createMotionSlot();
    slot.start('orbit', { direction: 'right', speed: 'slow', mode: 'continuous' });
    cam.tTheta = 0;
    var t1 = performance.now();
    while (performance.now() - t1 < 300) { slot.tick(cam, 1 / 60); await sleep(16); }
    var slowDeg = cam.tTheta * 180 / Math.PI;
    slot.interrupt('x');
    slot = CV.createMotionSlot();
    slot.start('orbit', { direction: 'right', speed: 'fast', mode: 'continuous' });
    cam.tTheta = 0;
    var t2 = performance.now();
    while (performance.now() - t2 < 300) { slot.tick(cam, 1 / 60); await sleep(16); }
    var fastDeg = cam.tTheta * 180 / Math.PI;
    log(fastDeg / Math.max(0.001, slowDeg) > 3, 'speed words: fast/slow ≈ ' + (fastDeg / Math.max(0.001, slowDeg)).toFixed(1) + '× (harap >3×)', 'slow=' + slowDeg.toFixed(2) + '° fast=' + fastDeg.toFixed(2) + '°');

    // 4. dolly trapezoid: start & end LAMBAT, cruise penuh; totalDeg tepat
    slot = CV.createMotionSlot();
    slot.start('dolly', { direction: 'right', speed: 'normal', totalDeg: 40, durationS: 2.5 });
    cam.tTheta = 0;
    var maxSpeed = 0, steps = [], t3 = performance.now();
    while (slot.active && performance.now() - t3 < 6000) {
      var prev = cam.tTheta;
      slot.tick(cam, 1 / 60);
      steps.push(cam.tTheta - prev);
      await sleep(16);
    }
    var totalDeg = cam.tTheta * 180 / Math.PI;
    var first3 = Math.abs((steps[0] + steps[1] + steps[2]) * 180 / Math.PI);
    var mid = steps.slice(Math.floor(steps.length / 2) - 2, Math.floor(steps.length / 2) + 2);
    var midMax = Math.max.apply(null, mid.map(Math.abs)) * 180 / Math.PI;
    var last3 = Math.abs((steps[steps.length - 1] + steps[steps.length - 2] + steps[steps.length - 3]) * 180 / Math.PI);
    log(Math.abs(totalDeg - 40) < 0.5, 'dolly: total sudut tepat 40°', 'got ' + totalDeg.toFixed(2) + '°');
    log(first3 < midMax * 0.4, 'dolly: mulai LAMAT (trapezoid ease-in)', 'first3=' + first3.toFixed(4) + '° mid=' + midMax.toFixed(4) + '°/step');
    log(last3 < midMax * 0.4, 'dolly: berhenti LAMAT (trapezoid ease-out)', 'last3=' + last3.toFixed(4) + '°');
    log(!slot.active, 'dolly: self-complete (slot idle setelah durasi)');

    // 5. single slot: verb baru menggantikan, hanya 1 aktif
    slot = CV.createMotionSlot();
    slot.start('orbit', { direction: 'right', mode: 'continuous' });
    slot.start('tilt', { direction: 'up', mode: 'continuous' });
    log(slot.info().kind === 'tilt', 'single slot: tilt menggantikan orbit');

    // 6. bindCancelFlight: wheel/pointerdown → interrupt('manual-input')
    var cv2 = document.createElement('div');
    document.body.appendChild(cv2);
    var slot2 = CV.createMotionSlot();
    slot2.start('orbit', { direction: 'right', mode: 'continuous' });
    var unbind = CV.bindCancelFlight(slot2, cv2);
    cv2.dispatchEvent(new window.PointerEvent('pointerdown', { bubbles: true }));
    log(!slot2.active, 'cancelFlight: pointerdown → interrupt otomatis');
    slot2.start('orbit', { direction: 'right', mode: 'continuous' });
    cv2.dispatchEvent(new window.WheelEvent('wheel', { bubbles: true, cancelable: true }));
    log(!slot2.active, 'cancelFlight: wheel → interrupt otomatis');
    unbind();
    slot2.start('orbit', { direction: 'right', mode: 'continuous' });
    cv2.dispatchEvent(new window.PointerEvent('pointerdown', { bubbles: true }));
    log(slot2.active, 'setelah unbind, input manual TIDAK meng-interrupt');
    slot2.interrupt('end');

    out.textContent += '\n\n==== VERB LIVE ' + (fail === 0 ? 'ALL PASS' : fail + ' FAIL') + ' (' + pass + '/' + (pass + fail) + ') ====';
    console.log('==== VERB LIVE ' + (fail === 0 ? 'ALL PASS' : fail + ' FAIL') + ' ====');
  })();
})();
</script>
</body></html>
