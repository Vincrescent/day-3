<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Universe Eye — Real Browser Diagnostics</title>
<style>body{margin:0;background:#000}</style>
</head>
<body>
<div id="d" style="display:none"></div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../js/corona.js"></script>
<script src="../../js/noise.js"></script>
<script src="../../js/starfield.js"></script>
<script src="../../js/solar-system.js"></script>
<script src="../../js/camera.js"></script>
<script src="../../js/ui.js"></script>
<script>
(function(){
  var out = [];
  var fail = 0;
  function log(m) { out.push(m); if (/^FAIL/.test(m)) fail++; }
  function ok(m) { out.push(m); }
  try {
    // ====== WebGL ======
    var canvas = document.getElementById('c');
    var gl = null;
    try { gl = canvas.getContext('webgl2') || canvas.getContext('webgl'); } catch(e) { log('FAIL webgl: ' + e.message); }
    if (gl) ok('PASS webgl context: ' + (gl instanceof WebGL2RenderingContext ? 'WebGL2' : 'WebGL1') + ' / ' + gl.getParameter(gl.RENDERER));
    else log('FAIL no webgl context');

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(800, 500);
    renderer.setPixelRatio(1);
    renderer.render = renderer.render.bind(renderer);
    ok('PASS WebGLRenderer created');

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(55, 800/500, 0.1, 6000);
    scene.add(camera);
    camera.position.set(0, 60, 140);
    camera.lookAt(0,0,0);

    // ====== Starfield ======
    var star = window.UEStarfield ? window.UEStarfield.build() : null;
    if (star) { scene.add(star.group); ok('PASS starfield built'); }
    else log('FAIL starfield build');

    // ====== Solar system (full, real build) ======
    var t0 = performance.now();
    var sys = window.UESolarSystem.build({ textures: {} });
    scene.add(sys.group);
    ok('PASS solar-system build: ' + sys.bodies.length + ' bodies in ' + (performance.now() - t0).toFixed(1) + 'ms');

    // ====== FIX 1: bulan parenting ======
    var moon = sys.bodies[sys.byId('moon')], earth = sys.bodies[sys.byId('earth')], sun = sys.bodies[sys.byId('sun')];
    var mp = new THREE.Vector3(), ep = new THREE.Vector3(), sp = new THREE.Vector3();
    sys.tick(2.0);
    moon.node.getWorldPosition(mp);
    earth.node.getWorldPosition(ep);
    sun.node.getWorldPosition(sp);
    var dMoonEarth = mp.distanceTo(ep);
    var dMoonSun = mp.distanceTo(sp);
    var dEarthSun = ep.distanceTo(sp);
    log(dMoonEarth < moon.body.orbit * 1.25 && dMoonEarth > moon.body.orbit * 0.75
        ? 'PASS moon orbits earth: dist=' + dMoonEarth.toFixed(2) + ' (orbit=' + moon.body.orbit + ')'
        : 'FAIL moon-earth dist=' + dMoonEarth.toFixed(2));
    log(dMoonSun > dEarthSun * 0.8
        ? 'PASS moon follows earth (dist-to-sun ' + dMoonSun.toFixed(1) + ' ~ earth ' + dEarthSun.toFixed(1) + ')'
        : 'FAIL moon at sun: moon-sun=' + dMoonSun.toFixed(1) + ' earth-sun=' + dEarthSun.toFixed(1));

    // ====== FIX 2: planet visible (radius + material) ======
    var hidden = [];
    sys.bodies.forEach(function(r){
      if (r.body.kind === 'star') return;
      if (r.mesh.visible === false || r.node.visible === false) hidden.push(r.body.id + ':visible=false');
      if (!r.mesh.geometry) hidden.push(r.body.id + ':no geometry');
      if (!r.mesh.material) hidden.push(r.body.id + ':no material');
    });
    log(hidden.length ? 'FAIL hidden bodies: ' + hidden.join(', ') : 'PASS all 9 non-sun bodies have visible mesh + material');

    // ====== Radius planet (kecuali "tidak ada model") ======
    var radii = {};
    sys.bodies.forEach(function(r){ radii[r.body.id] = r.body.radius; });
    var minNonSun = Math.min.apply(null, sys.bodies.filter(function(r){return r.body.kind!=='star'}).map(function(r){return r.body.radius;}));
    log(minNonSun >= 0.8 ? 'PASS smallest planet radius=' + minNonSun + ' (visible at camera dist)' : 'FAIL planet too small: ' + minNonSun);

    // ====== Textures (staggered) ======
    var remain = sys.texturesRemaining();
    ok('INFO texture queue at boot: ' + remain + ' (to be built per-frame)');
    // Force build all
    var built = 0;
    while (sys.texturesRemaining() > 0 && built < 30) { sys.stepTextures(); built++; }
    var withTex = sys.bodies.filter(function(r){ return r.body.kind!=='star' && r.mesh.material && r.mesh.material.map; }).length;
    log(withTex >= 7 ? 'PASS textures: ' + withTex + ' planets have maps after stepTextures' : 'FAIL textures: only ' + withTex + ' have maps');

    // ====== Orbit lines ======
    var lineCount = sys.orbitLines.length;
    log(lineCount >= 8 ? 'PASS orbit lines: ' + lineCount : 'FAIL orbit lines: ' + lineCount);

    // ====== Scale mode ======
    sys.setScaleMode('orbit');
    sys.setScaleMode('visual');
    log('PASS setScaleMode orbit<->visual no error');

    // ====== Render 5 frames ======
    try {
      for (var i=0;i<5;i++) { sys.tick(0.5); renderer.render(scene, camera); }
      var glErr = gl.getError();
      log(glErr === 0 ? 'PASS render 5 frames, GL error=0 (NO_ERROR)' : 'FAIL render GL error=' + glErr);
    } catch(e) { log('FAIL render: ' + e.message); }

    // ====== Camera ======
    var cam = new window.UECamera(camera, document.body);
    cam.focusBody(earth);
    for (var i=0;i<60;i++) cam.update(1/60);
    log('PASS UECamera focus+update no error');

    // ====== Corona overlay (adaptasi MIT) ======
    var cor = window.UECorona.create();
    document.body.appendChild(cor.canvas);
    cor.resize(800, 500);
    cor.hide(false);
    // arahkan kamera ke Matahari supaya disc terproyeksi besar
    camera.position.set(60, 18, 80);
    camera.lookAt(0, 0, 0);
    sys.tick(0.1);
    cor.tick(camera, sys);
    var img = cor.ctx.getImageData(0, 0, cor.canvas.width, cor.canvas.height).data;
    var nonZero = 0, warm = 0;
    for (var px = 3; px < img.length; px += 4) {
      if (img[px] > 0) nonZero++;
      if (img[px - 3] > img[px - 1]) warm++; // R > B = hangat (corona matahari)
    }
    log(nonZero > 500 ? 'PASS corona drew ' + nonZero + ' alpha px (' + warm + ' warm)' : 'FAIL corona drew only ' + nonZero + ' alpha px');
    // frame-cap: tick kedua harus skip (tak ada draw baru) — cek deterministik saja
    log('PASS corona behind-camera guard: ' + (typeof window.UECorona.bodyDiscScreenRadius === 'function'));

    // ====== UI ======
    // Inject minimal DOM for ui.js
    var uiHtml = '<div id="chips"></div><div id="panel" class="hidden"><button id="panel-close">×</button><span id="p-eyebrow"></span><h2 id="p-name"></h2><div id="p-latin"></div><div id="p-facts"></div><blockquote id="p-quote"></blockquote><span id="p-src"></span></div><div id="dock"><button id="btn-orbits"></button><button id="btn-home"></button><button id="btn-tour"></button><button id="btn-labels"></button><button id="btn-scale"></button><button id="btn-cine"></button></div><div id="timebar"><button id="btn-pause"></button><input id="speed" type="range" min="0.25" max="10" step="0.25" value="1"><span id="speed-val"></span></div><div id="cinema-bars"><div class="letterbox-top"></div><div class="letterbox-bottom"></div></div><div id="hint"></div><div id="labels"></div><div id="fps"></div>';
    document.body.insertAdjacentHTML('beforeend', uiHtml);
    var ui = new window.UEUI(sys, cam, { onScaleMode: function(m){ sys.setScaleMode(m); } });
    log('PASS UEUI constructed');
    // focus earth
    var chips = document.querySelectorAll('#chips .chip');
    log(chips.length === 10 ? 'PASS 10 chips' : 'FAIL chips: ' + chips.length);
    var ec = Array.from(chips).find(function(c){ return c.getAttribute('data-body')==='earth'; });
    if (ec) { ec.click(); }
    var pn = document.getElementById('p-name').textContent;
    log(pn === 'Bumi' ? 'PASS panel shows Bumi' : 'FAIL panel: ' + pn);

  } catch (e) {
    log('FAIL top-level: ' + e.message + '\n' + (e.stack||'').split('\n').slice(0,3).join('\n'));
  }

  var el = document.getElementById('d');
  el.style.display = 'block';
  el.textContent = out.join('\n') + '\n\n==== ' + (fail ? fail + ' FAILURES' : 'ALL PASS') + ' ====';
  document.title = (fail ? 'FAIL ' + fail : 'ALL PASS') + ' | ' + out.length + ' checks';
  window.__DIAG_DONE__ = true;
  console.log(out.join('\n'));
})();
</script>
</body>
</html>
